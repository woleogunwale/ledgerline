<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#12161f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ledgerline">
<meta name="application-name" content="Ledgerline">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon-180.png">
<title>Ledgerline — Multi-Business Invoicing</title>
<style>
/* ============================================================
   LEDGERLINE — design system
   A precise, ledger-grade receivables workspace.
   Dark command rail + paper-white document workspace.
   Per-profile accent repaints the app to prevent misbilling.
   ============================================================ */
:root{
  --ink:#12161f; --ink-2:#1a2030; --ink-3:#232b3d; --rail-line:#2c3550;
  --paper:#ffffff; --wash:#f4f6fb; --wash-2:#eaeef7; --line:#dde3ef; --line-2:#c7d0e3;
  --text:#1a2233; --muted:#5b6784; --faint:#8a95ad; --inverse:#e8ecf6;
  --accent:#3b5bdb; --accent-ink:#ffffff; --accent-wash:#eef2ff; --accent-line:#c3d0f7;
  --ok:#12805c; --ok-wash:#e6f6ef; --warn:#b26a00; --warn-wash:#fdf3e2;
  --bad:#c0392b; --bad-wash:#fdecea; --info:#2b6cb0;
  --radius:11px; --radius-s:8px; --radius-l:16px;
  --shadow:0 1px 2px rgba(17,22,31,.06),0 8px 24px -12px rgba(17,22,31,.18);
  --shadow-lg:0 24px 60px -24px rgba(17,22,31,.4);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,"Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{font-family:var(--sans);color:var(--text);background:var(--wash);
  font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
.mono,.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.money{font-variant-numeric:tabular-nums;white-space:nowrap}
h1,h2,h3,h4{margin:0;font-weight:640;letter-spacing:-.01em;color:var(--text)}
a{color:var(--accent);text-decoration:none}
::selection{background:var(--accent-wash)}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ---------- App frame ---------- */
#app{display:flex;min-height:100vh}
.rail{width:236px;flex:0 0 236px;background:var(--ink);color:var(--inverse);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:hidden;z-index:40}
.rail-top{padding:16px 16px 10px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:-.02em;font-size:16px;color:#fff}
.brand .glyph{width:26px;height:26px;border-radius:7px;background:var(--accent);display:grid;place-items:center;
  color:#fff;font-weight:800;font-size:13px;flex:0 0 26px;transition:background .25s}
.brand small{display:block;font-weight:500;font-size:10.5px;color:var(--faint);letter-spacing:.02em;margin-top:1px}

/* profile switcher — the signature element */
.psw{margin:12px 12px 4px;position:relative}
.psw-btn{width:100%;text-align:left;background:var(--ink-2);border:1px solid var(--rail-line);
  border-radius:var(--radius-s);padding:9px 10px;color:var(--inverse);display:flex;align-items:center;gap:9px;
  transition:border-color .2s,background .2s}
.psw-btn:hover{background:var(--ink-3)}
.psw-dot{width:12px;height:12px;border-radius:4px;background:var(--accent);flex:0 0 12px;box-shadow:0 0 0 3px rgba(255,255,255,.06)}
.psw-txt{min-width:0;flex:1}
.psw-name{font-weight:640;font-size:12.5px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.psw-legal{font-size:10.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.psw-car{color:var(--faint);flex:0 0 auto}
.psw-menu{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--ink-2);
  border:1px solid var(--rail-line);border-radius:var(--radius-s);box-shadow:var(--shadow-lg);
  z-index:60;padding:5px;max-height:60vh;overflow:auto}
.psw-item{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:6px;cursor:pointer}
.psw-item:hover{background:var(--ink-3)}
.psw-item.on{background:var(--ink-3)}
.psw-item .psw-name{font-size:12px}
.psw-item .arch{font-size:9px;color:var(--warn);border:1px solid var(--warn);border-radius:4px;padding:0 4px;margin-left:auto}
.psw-all{border-top:1px solid var(--rail-line);margin-top:4px;padding-top:6px}

nav.menu{padding:8px 10px;flex:1;overflow:auto}
.mgroup{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--faint);
  padding:12px 8px 5px;font-weight:640}
.mitem{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;color:#cdd5e8;
  font-size:13px;font-weight:520;position:relative;transition:background .15s,color .15s;margin:1px 0}
.mitem:hover{background:var(--ink-2);color:#fff}
.mitem.on{background:var(--ink-2);color:#fff}
.mitem.on::before{content:"";position:absolute;left:-10px;top:50%;transform:translateY(-50%);
  width:3px;height:18px;border-radius:0 3px 3px 0;background:var(--accent)}
.mitem svg{flex:0 0 17px;color:var(--faint)}
.mitem.on svg,.mitem:hover svg{color:var(--accent)}
.mitem .cnt{margin-left:auto;font-size:11px;background:var(--ink-3);color:#b9c2da;border-radius:20px;
  padding:1px 7px;font-variant-numeric:tabular-nums}
.mitem .cnt.alert{background:var(--bad);color:#fff}
.rail-foot{padding:10px 12px;border-top:1px solid var(--rail-line);font-size:11px;color:var(--faint)}
.sync-pill{display:flex;align-items:center;gap:7px;background:var(--ink-2);border-radius:20px;padding:6px 10px;margin-bottom:8px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--warn)}
.sync-dot.local{background:#7c8bb0}

/* ---------- Main ---------- */
main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:rgba(244,246,251,.86);backdrop-filter:saturate(1.2) blur(10px);
  border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;gap:14px}
.crumb{font-size:12px;color:var(--muted);font-weight:560}
.crumb b{color:var(--text);font-weight:680}
.topbar .search{margin-left:auto;position:relative}
.topbar .search input{width:230px;padding:8px 11px 8px 32px;border:1px solid var(--line);border-radius:20px;
  background:var(--paper);color:var(--text)}
.topbar .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--faint)}
.content{padding:22px;max-width:1200px;width:100%;margin:0 auto;flex:1}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--paper);
  color:var(--text);border-radius:var(--radius-s);padding:8px 13px;font-weight:600;font-size:13px;
  transition:all .15s;white-space:nowrap}
.btn:hover{border-color:var(--faint);box-shadow:var(--shadow)}
.btn svg{flex:0 0 auto}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06);box-shadow:0 6px 18px -6px var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--wash-2);color:var(--text);box-shadow:none}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:6px}
.btn.danger{color:var(--bad);border-color:var(--bad-wash)}
.btn.danger:hover{background:var(--bad-wash);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
.btn-row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}

/* ---------- Cards / layout ---------- */
.page-head{display:flex;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-head h1{font-size:22px}
.page-head .sub{color:var(--muted);font-size:13px;margin-top:3px}
.page-head .spacer{flex:1}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card.pad{padding:18px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g2{grid-template-columns:repeat(2,1fr)}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow)}
.stat .lbl{font-size:11.5px;color:var(--muted);font-weight:580;letter-spacing:.01em;display:flex;align-items:center;gap:6px}
.stat .val{font-size:25px;font-weight:700;margin-top:7px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .foot{font-size:11.5px;color:var(--faint);margin-top:3px}
.stat.accent{border-color:var(--accent-line);background:linear-gradient(180deg,var(--accent-wash),var(--paper))}
.stat.accent .val{color:var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}

/* ---------- Table ---------- */
.tbl-wrap{overflow:auto;border-radius:var(--radius)}
table.data{width:100%;border-collapse:collapse;font-size:13px}
table.data th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
  font-weight:640;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--wash);position:sticky;top:0}
table.data td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.data tr:last-child td{border-bottom:none}
table.data tbody tr{cursor:pointer;transition:background .12s}
table.data tbody tr:hover{background:var(--wash)}
table.data .r{text-align:right} table.data .c{text-align:center}
.linkish{color:var(--accent);font-weight:620}
.subrow td{background:var(--wash);font-size:12px;color:var(--muted)}
.empty{text-align:center;padding:46px 20px;color:var(--muted)}
.empty svg{color:var(--line-2);margin-bottom:10px}
.empty h3{color:var(--text);margin-bottom:5px;font-size:15px}

/* ---------- Badges / chips ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:640;padding:2.5px 8px;border-radius:20px;
  border:1px solid transparent;letter-spacing:.01em;white-space:nowrap}
.badge .dt{width:6px;height:6px;border-radius:50%}
.b-gray{background:var(--wash-2);color:var(--muted)}
.b-blue{background:var(--accent-wash);color:var(--accent);border-color:var(--accent-line)}
.b-green{background:var(--ok-wash);color:var(--ok)}
.b-amber{background:var(--warn-wash);color:var(--warn)}
.b-red{background:var(--bad-wash);color:var(--bad)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:560;padding:3px 9px;border-radius:7px;
  background:var(--wash-2);color:var(--muted);border:1px solid var(--line)}

/* ---------- Forms ---------- */
.field{margin-bottom:14px}
.field > label{display:block;font-size:12px;font-weight:620;color:var(--text);margin-bottom:5px}
.field .hint{font-size:11px;color:var(--faint);font-weight:400;margin-top:4px}
.field .req{color:var(--bad)}
.inp,select.inp,textarea.inp{width:100%;padding:9px 11px;border:1px solid var(--line-2);border-radius:var(--radius-s);
  background:var(--paper);color:var(--text);transition:border-color .15s,box-shadow .15s}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash);outline:none}
textarea.inp{resize:vertical;min-height:64px;line-height:1.5}
.inp.right{text-align:right;font-variant-numeric:tabular-nums}
.frow{display:grid;gap:12px}
.frow.c2{grid-template-columns:1fr 1fr} .frow.c3{grid-template-columns:1fr 1fr 1fr}
.frow.c4{grid-template-columns:1fr 1fr 1fr 1fr}
.inp-group{display:flex;align-items:stretch}
.inp-group .pre{display:flex;align-items:center;padding:0 10px;background:var(--wash-2);border:1px solid var(--line-2);
  border-right:none;border-radius:var(--radius-s) 0 0 var(--radius-s);color:var(--muted);font-size:13px;font-weight:600}
.inp-group .inp{border-radius:0 var(--radius-s) var(--radius-s) 0}
.check{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;user-select:none}
.check input{width:16px;height:16px;accent-color:var(--accent)}
.seg{display:inline-flex;background:var(--wash-2);border-radius:var(--radius-s);padding:3px;gap:2px;border:1px solid var(--line)}
.seg button{border:none;background:transparent;padding:6px 12px;border-radius:6px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--paper);color:var(--text);box-shadow:var(--shadow)}

/* filters bar */
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.toolbar .seg{margin:0}
.toolbar select.inp,.toolbar input.inp{width:auto;padding:7px 10px}

/* ---------- Modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(15,20,32,.5);backdrop-filter:blur(3px);z-index:100;
  display:flex;align-items:flex-start;justify-content:center;padding:28px 16px;overflow:auto}
.modal{background:var(--paper);border-radius:var(--radius-l);box-shadow:var(--shadow-lg);width:100%;max-width:720px;
  margin:auto;animation:pop .18s ease}
.modal.wide{max-width:1000px} .modal.narrow{max-width:480px}
@keyframes pop{from{transform:translateY(8px) scale(.99);opacity:0}to{transform:none;opacity:1}}
.mhead{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;
  background:var(--paper);border-radius:var(--radius-l) var(--radius-l) 0 0;z-index:2}
.mhead h2{font-size:17px} .mhead .mh-sub{font-size:12px;color:var(--muted);margin-top:2px}
.mhead .x{margin-left:auto;background:var(--wash-2);border:none;width:32px;height:32px;border-radius:8px;color:var(--muted);
  display:grid;place-items:center}
.mhead .x:hover{background:var(--wash);color:var(--text)}
.mbody{padding:22px}
.mfoot{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;position:sticky;bottom:0;
  background:var(--paper);border-radius:0 0 var(--radius-l) var(--radius-l)}
.mfoot .spacer{flex:1}

/* line item editor */
.li-tbl{width:100%;border-collapse:collapse;font-size:13px}
.li-tbl th{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:6px 6px;font-weight:640}
.li-tbl td{padding:4px 5px;vertical-align:top}
.li-tbl .inp{padding:7px 8px}
.li-tbl .liq{width:66px} .li-tbl .lir{width:104px} .li-tbl .lit{width:96px}
.li-del{background:transparent;border:none;color:var(--faint);padding:6px;border-radius:6px}
.li-del:hover{background:var(--bad-wash);color:var(--bad)}
.totbox{margin-left:auto;width:320px;max-width:100%}
.totrow{display:flex;justify-content:space-between;padding:5px 0;font-size:13px}
.totrow.grand{border-top:2px solid var(--text);margin-top:6px;padding-top:9px;font-size:17px;font-weight:700}
.totrow.bal{color:var(--accent);font-weight:700}
.totrow .money{font-variant-numeric:tabular-nums}

/* ---------- Document / paper preview ---------- */
.doc-scroll{background:var(--wash-2);padding:0;max-height:none}
.paper{background:#fff;color:#111;width:100%;max-width:820px;margin:0 auto;padding:44px 46px;
  font-size:13px;line-height:1.5;box-shadow:var(--shadow)}
.paper .d-top{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;margin-bottom:26px}
.paper .d-logo{width:56px;height:56px;border-radius:11px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:22px}
.paper .d-seller h2{font-size:17px;margin-bottom:2px}
.paper .d-seller .op{font-size:12px;color:#555;font-style:italic}
.paper .d-seller p{margin:2px 0;color:#444;font-size:12px}
.paper .d-meta{text-align:right}
.paper .d-meta .d-type{font-size:26px;font-weight:800;letter-spacing:-.02em;text-transform:uppercase}
.paper .d-meta table{margin-left:auto;font-size:12px;border-collapse:collapse}
.paper .d-meta td{padding:2px 0 2px 16px;text-align:right} .paper .d-meta td.k{color:#666}
.paper .d-paidstamp{display:inline-block;border:3px solid var(--ok);color:var(--ok);font-weight:800;font-size:18px;
  padding:3px 14px;border-radius:8px;transform:rotate(-6deg);letter-spacing:.05em;text-transform:uppercase}
.paper .d-overstamp{border-color:var(--bad);color:var(--bad)}
.paper .bill-to{display:flex;justify-content:space-between;gap:24px;margin:20px 0}
.paper .bill-to .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#888;font-weight:700;margin-bottom:4px}
.paper .bill-to b{font-size:14px}
.paper table.lines{width:100%;border-collapse:collapse;margin:14px 0}
.paper table.lines th{background:#f3f4f8;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.05em;
  color:#555;padding:9px 10px;border-bottom:2px solid #222}
.paper table.lines th.r,.paper table.lines td.r{text-align:right}
.paper table.lines td{padding:10px;border-bottom:1px solid #e6e8ef;vertical-align:top;font-variant-numeric:tabular-nums}
.paper table.lines .desc b{display:block;font-size:13px} .paper table.lines .desc small{color:#777}
.paper .d-tot{margin-left:auto;width:290px;margin-top:14px}
.paper .d-tot .tr{display:flex;justify-content:space-between;padding:5px 0;font-size:13px;font-variant-numeric:tabular-nums}
.paper .d-tot .tr.grand{border-top:2px solid #222;margin-top:5px;padding-top:9px;font-size:17px;font-weight:800}
.paper .d-tot .tr.paidln{color:var(--ok)} .paper .d-tot .tr.balln{font-weight:800;font-size:16px;color:#111;border-top:1px dashed #bbb;margin-top:4px;padding-top:8px}
.paper .d-note{margin-top:26px;padding-top:16px;border-top:1px solid #e6e8ef;color:#555;font-size:12px}
.paper .d-note h4{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#888;margin-bottom:5px}
.paper .d-pay{background:#f7f8fb;border:1px solid #e6e8ef;border-radius:10px;padding:12px 14px;margin-top:14px;font-size:12px}
.paper .d-hist{margin-top:14px;font-size:12px;width:100%;border-collapse:collapse}
.paper .d-hist th{text-align:left;color:#888;font-size:10px;text-transform:uppercase;padding:4px 8px;border-bottom:1px solid #ddd}
.paper .d-hist td{padding:5px 8px;border-bottom:1px solid #f0f0f0;font-variant-numeric:tabular-nums}
.paper .d-foot{margin-top:30px;text-align:center;color:#999;font-size:11px}
.watermark{position:relative}
.watermark::after{content:attr(data-wm);position:absolute;inset:0;display:grid;place-items:center;
  font-size:92px;font-weight:900;color:rgba(0,0,0,.05);transform:rotate(-24deg);pointer-events:none;letter-spacing:.1em}

/* timeline */
.timeline{position:relative;padding-left:22px}
.timeline::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-item{position:relative;padding:0 0 16px 0}
.tl-item::before{content:"";position:absolute;left:-19px;top:3px;width:11px;height:11px;border-radius:50%;
  background:#fff;border:2.5px solid var(--accent)}
.tl-item .tl-time{font-size:11px;color:var(--faint)}
.tl-item .tl-txt{font-size:13px;margin-top:1px}
.tl-item .tl-txt b{font-weight:640}

/* toast */
#toasts{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:9px;max-width:340px}
.toast{background:var(--ink);color:#fff;padding:11px 15px;border-radius:10px;box-shadow:var(--shadow-lg);
  font-size:13px;display:flex;align-items:center;gap:10px;animation:slidein .2s ease}
.toast .tdot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:0 0 8px}
.toast.err .tdot{background:var(--bad)} .toast.warn .tdot{background:var(--warn)}
@keyframes slidein{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}

/* misc */
.help{background:var(--accent-wash);border:1px solid var(--accent-line);border-radius:var(--radius);padding:12px 14px;
  font-size:12.5px;color:var(--text);display:flex;gap:10px;margin-bottom:16px}
.help svg{flex:0 0 auto;color:var(--accent);margin-top:1px}
.warnbox{background:var(--warn-wash);border:1px solid #f0d9a8;color:#7a4e00;border-radius:var(--radius);padding:11px 14px;
  font-size:12.5px;display:flex;gap:10px;margin-bottom:14px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--muted);font-weight:560} .kv dd{margin:0;font-weight:560}
hr.sep{border:none;border-top:1px solid var(--line);margin:18px 0}
.pill-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px}
.pill-tabs button{background:none;border:none;padding:9px 14px;font-size:13px;font-weight:600;color:var(--muted);

.pill-tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.mobonly{display:none}
.allocrow{display:grid;grid-template-columns:1fr 120px 130px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}

/* ---------- Responsive ---------- */
@media(max-width:940px){
  .rail{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .22s;box-shadow:var(--shadow-lg)}

}
@media(max-width:560px){ .g4{grid-template-columns:1fr} .allocrow{grid-template-columns:1fr}

/* ---------- Print ---------- */
@media print{
  @page{margin:14mm}
  body{background:#fff}
  #app > .rail,.topbar,#toasts,.mfoot,.mhead .x,.doc-actions{display:none !important}
  #app,main,.content{display:block;padding:0;margin:0;max-width:none}

  .modal{box-shadow:none;max-width:none;border-radius:0;margin:0}

  .doc-scroll{background:#fff;padding:0}
  .paper{box-shadow:none;max-width:none;padding:0;margin:0;width:100%}
  .no-print{display:none !important}
}

/* ---- Currency & money (integer minor units; no binary float for money) ---- */
const CURRENCIES = {
  CAD:{sym:'$',code:'CAD',dec:2,name:'Canadian Dollar'},
  USD:{sym:'$',code:'USD',dec:2,name:'US Dollar'},
  NGN:{sym:'₦',code:'NGN',dec:2,name:'Nigerian Naira'},
  GBP:{sym:'£',code:'GBP',dec:2,name:'British Pound'},
  EUR:{sym:'€',code:'EUR',dec:2,name:'Euro'},
};
function ccy(c){return CURRENCIES[c]||CURRENCIES.CAD;}
// parse a user string ("1,250.50") into integer minor units for the currency
function toMinor(val,cur){
  const c=ccy(cur);const n=String(val==null?'':val).replace(/[^0-9.\-]/g,'');
  if(n===''||n==='-'||n==='.')return 0;
  const f=Math.round(parseFloat(n)*Math.pow(10,c.dec));
  return Number.isFinite(f)?f:0;
}
// integer minor units -> decimal string
function minorToStr(m,cur){const c=ccy(cur);return (m/Math.pow(10,c.dec)).toFixed(c.dec);}
// format money for display
function money(m,cur,opts){
  opts=opts||{};const c=ccy(cur);
  const neg=m<0;const abs=Math.abs(m);
  const s=(abs/Math.pow(10,c.dec)).toLocaleString('en-CA',{minimumFractionDigits:c.dec,maximumFractionDigits:c.dec});
  const out=(opts.sign&&!neg&&m!==0?'+':'')+(neg?'-':'')+c.sym+s+(opts.code?' '+c.code:'');
  return out;
}
// multiply integer minor by a decimal quantity/rate, returning integer minor (banker-safe rounding)
function mulMinor(minor,qty){return Math.round(minor*qty);}
// percentage of an integer minor amount
function pctMinor(minor,pct){return Math.round(minor*(pct/100));}

/* ---- Number parsing for quantities/rates (decimal, not money) ---- */
function num(v,def){const n=parseFloat(String(v==null?'':v).replace(/[^0-9.\-]/g,''));return Number.isFinite(n)?n:(def||0);}

/* ========================= STORAGE ========================= */
/* Uses claude.ai artifact window.storage when present; falls back to
   localStorage so the same downloaded file works when self-hosted. */
const STORE_KEY='ledgerline_db_v1';
const Storage = {
  async load(){
    try{
      if(window.storage && window.storage.get){
        const r=await window.storage.get(STORE_KEY);
        return r&&r.value?JSON.parse(r.value):null;
      }
    }catch(e){/* fall through */}
    try{const raw=localStorage.getItem(STORE_KEY);return raw?JSON.parse(raw):null;}catch(e){return null;}
  },
  async save(db){
    const json=JSON.stringify(db);
    try{
      if(window.storage && window.storage.set){await window.storage.set(STORE_KEY,json);return;}
    }catch(e){/* fall through */}
    try{localStorage.setItem(STORE_KEY,json);}catch(e){toast('Storage full — export a backup','err');}
  }
};

/* ========================= FINANCE ENGINE =========================
   All amounts are integer minor units. Balances are ALWAYS computed
   from append-only events, never stored as an editable number. */

// Compute a single line's amount (integer minor units)
function lineAmount(li){
  // percentage-type lines compute against a provided base
  if(li.kind==='percent'){ return pctMinor(li.baseMinor||0, num(li.qty,0)); }
  return mulMinor(li.priceMinor||0, num(li.qty,0));
}

// Reproducible invoice/estimate totals from its own snapshot of lines & settings
function computeTotals(doc){
  const cur=doc.currency;
  let subtotal=0, taxable=0, nonTaxable=0;
  const lines=(doc.lines||[]).map(li=>{
    const amt=lineAmount(li);
    return {...li, amountMinor:amt};
  });
  lines.forEach(li=>{
    subtotal+=li.amountMinor;
    if(li.taxable) taxable+=li.amountMinor; else nonTaxable+=li.amountMinor;
  });
  // document-level discount (percent or fixed)
  let discountMinor=0;
  if(doc.discountType==='percent') discountMinor=pctMinor(subtotal, num(doc.discountValue,0));
  else if(doc.discountType==='fixed') discountMinor=toMinor(doc.discountValue||0,cur);
  discountMinor=Math.min(discountMinor, subtotal);
  // apportion discount across taxable base proportionally
  const taxableAfterDisc = subtotal>0 ? taxable - Math.round(discountMinor*(taxable/subtotal)) : 0;
  const taxRate=num(doc.taxRate,0);
  const taxMinor = doc.taxInclusive ? 0 : pctMinor(Math.max(0,taxableAfterDisc), taxRate);
  const shippingMinor = toMinor(doc.shippingValue||0,cur);
  const withholdingMinor = doc.withholdingPct ? pctMinor(subtotal-discountMinor, num(doc.withholdingPct,0)) : 0;
  const total = subtotal - discountMinor + taxMinor + shippingMinor - withholdingMinor;
  return {lines,subtotalMinor:subtotal,discountMinor,taxableAfterDisc,taxMinor,shippingMinor,
          withholdingMinor,totalMinor:Math.max(0,total),taxRate};
}

// Credits applied to an invoice (from credit notes)
function invoiceCreditsApplied(invId){
  return DB.credits.filter(c=>c.invoiceId===invId && c.status!=='void')
    .reduce((s,c)=>s+(c.amountMinor||0),0);
}
function invoiceWriteoffs(invId){
  return DB.writeoffs.filter(w=>w.invoiceId===invId).reduce((s,w)=>s+(w.amountMinor||0),0);
}

// Net paid = confirmed allocations − confirmed refunds/reversals
function invoiceNetPaid(invId){
  let paid=0;
  DB.payments.forEach(p=>{
    if(p.status!=='confirmed'&&p.status!=='cleared')return;
    (p.allocations||[]).forEach(a=>{ if(a.invoiceId===invId) paid+=a.amountMinor; });
  });
  DB.refunds.forEach(r=>{ if(r.invoiceId===invId && r.status!=='void') paid-=r.amountMinor; });
  return paid;
}

// The full computed financial position of an invoice
function invoicePosition(inv){
  const t=inv.totals || computeTotals(inv);
  const total=t.totalMinor;
  const credits=invoiceCreditsApplied(inv.id);
  const writeoff=invoiceWriteoffs(inv.id);
  const netPaid=invoiceNetPaid(inv.id);
  const balance = total - credits - netPaid - writeoff;
  const tol=DB.settings.roundingToleranceMinor||0;
  let payStatus;
  if(inv.lifecycle==='void') payStatus='void';
  else if(balance<=tol && total>0) payStatus = (netPaid>total-credits+tol)?'overpaid':'paid';
  else if(netPaid>0 || credits>0 || writeoff>0) payStatus='partial';
  else payStatus='unpaid';
  return {totalMinor:total,creditsMinor:credits,writeoffMinor:writeoff,netPaidMinor:netPaid,
          balanceMinor:Math.max(0,balance),rawBalance:balance,payStatus};
}

// Due state computed independently of payment
function dueState(inv,today){
  today=today||todayStr();
  if(!inv.dueDate) return {state:'none',days:0};
  const d=daysBetween(today,inv.dueDate);
  if(d>0) return {state:'notdue',days:d};
  if(d===0) return {state:'due',days:0};
  return {state:'overdue',days:-d};
}

// AR aging bucket for an outstanding invoice
function agingBucket(inv,today){
  const ds=dueState(inv,today);
  if(ds.state!=='overdue') return 'current';
  const d=ds.days;
  if(d<=30)return '1-30'; if(d<=60)return '31-60'; if(d<=90)return '61-90'; return '90+';
}

/* ---------- Numbering (per profile + doc type) ---------- */
function nextNumber(profile,type){
  const seq=profile.seq[type];
  const n=seq.next;
  const yr=new Date().getFullYear();
  const full=(seq.prefix||'').replace('{YYYY}',yr).replace('{YY}',String(yr).slice(2))+n;
  return {full,n};
}
function reserveNumber(profile,type){
  const {full,n}=nextNumber(profile,type);
  profile.seq[type].next=n+1;
  return full;
}

/* Read an image file, downscale to <=512px, return a compact PNG data URL. */
function fileToLogo(file,cb){
  if(!file){cb(null);return;}
  if(file.size>6*1024*1024){toast('Image is too large (max 6 MB)','err');cb(null);return;}
  const rd=new FileReader();
  rd.onload=()=>{const img=new Image();
    img.onload=()=>{const max=512;let w=img.width,h=img.height;const sc=Math.min(1,max/Math.max(w,h));
      const cw=Math.max(1,Math.round(w*sc)),ch=Math.max(1,Math.round(h*sc));
      const cv=document.createElement('canvas');cv.width=cw;cv.height=ch;
      const cx=cv.getContext('2d');cx.clearRect(0,0,cw,ch);cx.drawImage(img,0,0,cw,ch);
      try{cb(cv.toDataURL('image/png'));}catch(e){cb(null);}};
    img.onerror=()=>{toast('Could not read that image','err');cb(null);};
    img.src=rd.result;};
  rd.onerror=()=>{toast('Could not read that file','err');cb(null);};
  rd.readAsDataURL(file);
}

    return {
      subject:`${ctx.seller.brandName}: Invoice ${ctx.number} — ${money(ctx.balanceMinor,cur)} due ${fmtDate(ctx.dueDate)}`,
      body:`Hello ${ctx.customerName||''},\n\nPlease find invoice ${ctx.number} for ${money(ctx.totalMinor,cur)}, with ${money(ctx.balanceMinor,cur)} due by ${fmtDate(ctx.dueDate)}.\n\n${p.paymentInstructions||''}\n\nThank you,\n${p.authorizedSender||p.brandName}`,
      sms:`${p.brandName}: Invoice ${ctx.number} for ${money(ctx.balanceMinor,cur)} is due ${fmtDate(ctx.dueDate)}. ${p.paymentInstructions?p.paymentInstructions.split('·')[0].trim():''}`
    };
  }
  if(kind==='receipt'){
    const full=ctx.balanceAfterMinor<=0;
    return {
      subject:`${p.brandName}: Receipt ${ctx.number} — ${money(ctx.amountMinor,cur)} received`,
      body:`Hello ${ctx.customerName||''},\n\nThank you — we've received ${money(ctx.amountMinor,cur)} toward invoice ${ctx.invoiceNumber}.\n\nCumulative paid: ${money(ctx.cumulativePaidMinor,cur)}\nRemaining balance: ${money(ctx.balanceAfterMinor,cur)}\n${full?'This invoice is now paid in full.':''}\n\n${p.authorizedSender||p.brandName}`,
      sms:`${p.brandName}: Received ${money(ctx.amountMinor,cur)} for invoice ${ctx.invoiceNumber}. ${full?'Paid in full. Thank you!':'Balance '+money(ctx.balanceAfterMinor,cur)+'.'} Receipt ${ctx.number}.`
    };
  }
  if(kind==='reminder'){
    const od=ctx.overdueDays>0;
    return {
      subject:`${p.brandName}: ${od?'Overdue — ':''}Invoice ${ctx.number}, ${money(ctx.balanceMinor,cur)} ${od?'past due':'due '+fmtDate(ctx.dueDate)}`,
      body:`Hello ${ctx.customerName||''},\n\n${od?`Invoice ${ctx.number} is now ${ctx.overdueDays} day(s) past due.`:`This is a friendly reminder that invoice ${ctx.number} is due ${fmtDate(ctx.dueDate)}.`}\n\nOutstanding balance: ${money(ctx.balanceMinor,cur)}\n\n${p.paymentInstructions||''}\n\nIf you've already paid, thank you — please disregard this notice.\n\n${p.authorizedSender||p.brandName}`,
      sms:`${p.brandName}: Invoice ${ctx.number} balance ${money(ctx.balanceMinor,cur)} is ${od?ctx.overdueDays+'d overdue':'due '+fmtDate(ctx.dueDate)}. ${p.paymentInstructions?p.paymentInstructions.split('·')[0].trim():''}`
    };
  }
  return {subject:'',body:'',sms:''};
}

async function copyText(text){
  try{await navigator.clipboard.writeText(text);toast('Copied to clipboard');}
  catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');toast('Copied');}catch(_){toast('Copy failed — select manually','err');}ta.remove();}
}
async function shareDoc(title,text){
  if(navigator.share){try{await navigator.share({title,text});return;}catch(e){}}
  copyText(text);
}

  document.documentElement.style.setProperty('--accent-wash',hexA(a,0.10));
  document.documentElement.style.setProperty('--accent-line',hexA(a,0.32));
  document.querySelector('meta[name=theme-color]').setAttribute('content','#12161f');

function hexA(hex,a){const h=hex.replace('#','');const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
  return `rgba(${r},${g},${b},${a})`;}

/* ========================= SHARED HELPERS ========================= */
function payBadge(pos,inv){
  if(inv&&inv.lifecycle==='draft')return '<span class="badge b-gray">Draft</span>';
  if(inv&&inv.lifecycle==='void')return '<span class="badge b-gray">Void</span>';
  const m={paid:['b-green','Paid'],partial:['b-amber','Part-paid'],unpaid:['b-blue','Unpaid'],overpaid:['b-amber','Overpaid'],void:['b-gray','Void']}[pos.payStatus]||['b-gray',pos.payStatus];
  return `<span class="badge ${m[0]}">${m[1]}</span>`;
}
function dueBadge(inv){
  const pos=invoicePosition(inv);
  if(inv.lifecycle!=='issued'||pos.payStatus==='paid')return '';
  const ds=dueState(inv);
  if(ds.state==='overdue')return `<span class="badge b-red">${ds.days}d overdue</span>`;
  if(ds.state==='due')return `<span class="badge b-amber">Due today</span>`;
  if(ds.state==='notdue')return `<span class="badge b-gray">Due in ${ds.days}d</span>`;
  return '';
}
function deliveryBadge(inv){
  const d=inv.delivery||'notsent';
  const m={notsent:['b-gray','Not sent'],queued:['b-blue','Queued'],sent:['b-blue','Sent'],delivered:['b-green','Delivered'],viewed:['b-green','Viewed'],failed:['b-red','Failed']}[d];
  return `<span class="badge ${m[0]}">${m[1]}</span>`;
}
function emptyState(icn,title,msg,btn){
  return `<div class="empty">${icon(icn,40)}<h3>${esc(title)}</h3><p>${esc(msg)}</p>${btn||''}</div>`;
}

              <select class="inp" id="eDiscType" style="width:auto"><option value="none" ${d.discountType==='none'?'selected':''}>None</option><option value="percent" ${d.discountType==='percent'?'selected':''}>%</option><option value="fixed" ${d.discountType==='fixed'?'selected':''}>Fixed</option></select>
              <input class="inp right" id="eDiscVal" value="${esc(d.discountValue||'')}" placeholder="0"></div></div>

            <div class="field"><label>Withholding (%)</label><input class="inp right" id="eWH" value="${esc(d.withholdingPct||'')}" placeholder="0"></div>
          </div>
          ${kind==='estimate'?`<div class="field"><label>Deposit to confirm</label><input class="inp right" id="eDep" value="${d.depositMinor?minorToStr(d.depositMinor,cur):''}" placeholder="0.00"></div>
            <div class="field"><label>Scope</label><textarea class="inp" id="eScope">${esc(d.scope||'')}</textarea></div>`
          :`<div class="field"><label>Notes (shown on invoice)</label><textarea class="inp" id="eMemo">${esc(d.memo||'')}</textarea></div>`}
        </div>

  });
  // render lines + totals
  function readLinesFromDOM(){
    d.lines=$$('#eLines tr').map(tr=>{
      return {id:tr.dataset.lid,name:$('[data-f=name]',tr).value,note:'',
        qty:num($('[data-f=qty]',tr).value,0),unit:$('[data-f=unit]',tr).value,
        priceMinor:toMinor($('[data-f=price]',tr).value,cur),kind:'amount',
        taxable:$('[data-f=tax]',tr).checked};
    });
  }
  function drawLines(){
    $('#eLines').innerHTML=d.lines.map(li=>`<tr data-lid="${li.id}">

function validLines(d){return (d.lines||[]).some(li=>li.name.trim()&&(li.priceMinor!==0||num(li.qty)!==0));}
function saveEditorDraft(kind){
  const d=EDITOR;d.updatedAt=nowISO();

  if(existing)Object.assign(existing,d);else store.push(JSON.parse(JSON.stringify(d)));

function issueInvoiceFromEditor(){

  if(!validLines(d)){toast('Add at least one line item','err');return;}

  d.lifecycle='issued';d.issuedAt=nowISO();

function buildInvoiceTimeline(inv){
  const ev=[];
  if(inv.createdAt)ev.push({at:inv.createdAt,txt:'Draft created'});
  if(inv.issuedAt)ev.push({at:inv.issuedAt,txt:`Issued as <b>${esc(inv.number)}</b> · ${money((inv.totals||computeTotals(inv)).totalMinor,inv.currency)}`});
  (inv.deliveryEvents||[]).forEach(d=>ev.push({at:d.at,txt:`${esc(d.label)}`}));
  DB.payments.filter(p=>(p.allocations||[]).some(a=>a.invoiceId===inv.id)).forEach(p=>{
    const amt=(p.allocations||[]).filter(a=>a.invoiceId===inv.id).reduce((s,a)=>s+a.amountMinor,0);
    ev.push({at:p.createdAt||p.date,txt:`Payment ${money(amt,inv.currency)} · ${esc(methodLabel(p.method))}`});});
  DB.receipts.filter(r=>r.invoiceId===inv.id).forEach(r=>ev.push({at:r.createdAt,txt:`Receipt <b>${esc(r.number)}</b> issued`}));
  DB.credits.filter(c=>c.invoiceId===inv.id).forEach(c=>ev.push({at:c.createdAt,txt:`Credit note <b>${esc(c.number)}</b> · ${money(c.amountMinor,inv.currency)}`}));
  if(inv.voidedAt)ev.push({at:inv.voidedAt,txt:'<b>Voided</b>'});
  return ev.sort((a,b)=>new Date(b.at)-new Date(a.at));
}
function markDelivered(inv,channel){
  inv.delivery = channel==='email'||channel==='sms'?'sent':(inv.delivery==='notsent'?'delivered':inv.delivery);
  inv.deliveryEvents=inv.deliveryEvents||[];
  const label={email:'Sent by email',sms:'Sent by text',print:'Printed',download:'Downloaded',share:'Shared',manual:'Marked delivered'}[channel]||'Delivered';
  inv.deliveryEvents.push({at:nowISO(),channel,label});
  audit('invoice.deliver',inv.number+' · '+label,inv.id);commit();
}
function voidInvoice(inv,cb){

function detectDuplicatePayment(pay){
  return DB.payments.find(p=>p.customerId===pay.customerId&&p.amountMinor===pay.amountMinor&&p.date===pay.date&&p.method===pay.method&&(p.reference||'')===(pay.reference||''));
}
function recordPayment(data){
  const p=P();
  const pay={id:uid('pay'),profileId:p.id,customerId:data.customerId,number:reserveNumber(p,'receipt').replace(p.seq.receipt.prefix,'PAY-'),
    date:data.date,amountMinor:data.amountMinor,currency:p.currency,method:data.method,reference:data.reference,
    status:data.status,allocations:data.allocations,createdAt:nowISO()};
  // undo the receipt-number reservation used above for the PAY id (payments get their own simple id)
  p.seq.receipt.next-=1;
  const dup=detectDuplicatePayment(pay);
  const finish=()=>{
    DB.payments.push(pay);
    audit('payment.record',money(pay.amountMinor,pay.currency)+' · '+methodLabel(pay.method),pay.id);
    // customer credit if unallocated remainder
    const allocated=pay.allocations.reduce((s,a)=>s+a.amountMinor,0);
    const remainder=pay.amountMinor-allocated;
    if(remainder>0){pay.creditMinor=remainder;audit('credit.add','Customer credit '+money(remainder,pay.currency),pay.id);}
    // generate receipts + stop reminders
    if(data.issueReceipt&&pay.status==='confirmed'){
      pay.allocations.forEach(a=>{issueReceiptForAllocation(pay,a);});
      if(!pay.allocations.length){/* pure credit — a credit receipt */issueCreditReceipt(pay,remainder);}
    }
    // stop reminders where balance now zero
    pay.allocations.forEach(a=>{const inv=byId(DB.invoices,a.invoiceId);if(inv&&invoicePosition(inv).balanceMinor<=0){
      DB.messages.filter(m=>m.invoiceId===inv.id&&m.status==='pending').forEach(m=>m.status='cancelled');}});
    commit();renderView();toast('Payment recorded'+(data.issueReceipt?' · receipt issued':''));
  };
  if(dup){confirmModal('Possible duplicate','A payment with the same amount, date, method and reference already exists ('+dup.number+'). Record anyway?',finish);}
  else finish();
}

/* ========================= MESSAGES / REMINDERS ENGINE =========================
   Server-side automatic dispatch needs a backend; here the engine computes
   exactly what to send and when, queues it, revalidates balance at send time
   (never sends a stale/overdue notice for a paid invoice), and hands each
   message off through the device's email/SMS apps with one tap. */
function queueMessage(msg){
  DB.messages.unshift({id:uid('msg'),profileId:UI.profileId,status:'pending',createdAt:nowISO(),...msg});
}
function scheduleReminders(inv){
  const p=P();const sched=p.reminderSchedule||[-3,0,3,7,14];
  inv.reminderPlan=sched.map(offset=>({offset,date:addDays(inv.dueDate,offset),sent:false}));
}
// Recompute which reminders are now DUE (past their trigger date, invoice still owing)
function refreshReminderQueue(){
  const today=todayStr();
  scoped(DB.invoices).filter(i=>i.lifecycle==='issued').forEach(inv=>{
    const pos=invoicePosition(inv);
    if(pos.payStatus==='paid'){return;} // never remind a paid invoice
    (inv.reminderPlan||[]).forEach(step=>{
      if(step.sent||step.queued)return;
      if(step.date<=today){
        step.queued=true;
        const ds=dueState(inv);
        queueMessage({type:'reminder',invoiceId:inv.id,customerId:inv.customerId,stepDate:step.date,
          label:`${ds.state==='overdue'?ds.days+'d overdue':'Due reminder'} · ${inv.number} · ${money(pos.balanceMinor,inv.currency)}`});
      }
    });
  });
}
function sendReminderNow(invId){
  const inv=byId(DB.invoices,invId);if(!inv)return;
  const pos=invoicePosition(inv);
  if(pos.payStatus==='paid'){toast('Already paid — no reminder needed');return;}
  const c=customer(inv.customerId);const p=inv.seller||snapshotSeller(P());const ds=dueState(inv);
  const ctx={seller:p,currency:inv.currency,number:inv.number,dueDate:inv.dueDate,customerName:c?c.name:'',
    balanceMinor:pos.balanceMinor,overdueDays:ds.state==='overdue'?ds.days:0};
  const msg=composeMessage('reminder',ctx);
  modal({title:'Send reminder',sub:inv.number+' · '+money(pos.balanceMinor,inv.currency)+(ds.state==='overdue'?' · '+ds.days+'d overdue':''),size:'',
    body:`<div class="help">${icon('info',16)}<div>Balance rechecked just now: <b>${money(pos.balanceMinor,inv.currency)}</b> outstanding. This reminder reflects prior payments.</div></div>
      <div class="frow c2"><div class="field"><label>Email</label><input class="inp" id="mTo" value="${esc(c?c.email:'')}"></div>
        <div class="field"><label>Phone</label><input class="inp" id="mPhone" value="${esc(c?c.phone:'')}"></div></div>
      <div class="field"><label>Subject</label><input class="inp" id="mSub" value="${esc(msg.subject)}"></div>
      <div class="field"><label>Message</label><textarea class="inp" id="mBody" style="min-height:140px">${esc(msg.body)}</textarea></div>
      <div class="field"><label>Text version</label><textarea class="inp" id="mSms" style="min-height:60px">${esc(msg.sms)}</textarea></div>`,
    foot:`<div class="spacer"></div><button class="btn" id="mCopy">${icon('copy',15)}Copy</button><button class="btn" id="mSms2">${icon('sms',15)}Text</button><button class="btn primary" id="mMail">${icon('mail',15)}Email</button>`,
    onMount:(b,close)=>{
      const mark=()=>{markReminderSent(inv);};
      $('#mMail').onclick=()=>{openMail($('#mTo').value,$('#mSub').value,$('#mBody').value);mark();toast('Opening email…');close();renderView();};
      $('#mSms2').onclick=()=>{openSms($('#mPhone').value,$('#mSms').value);mark();toast('Opening messages…');close();renderView();};
      $('#mCopy').onclick=()=>copyText($('#mBody').value);
    }});
}
function markReminderSent(inv){
  const today=todayStr();
  (inv.reminderPlan||[]).forEach(s=>{if(!s.sent&&s.date<=today){s.sent=true;s.queued=false;s.sentAt=nowISO();}});
  DB.messages.filter(m=>m.invoiceId===inv.id&&m.type==='reminder'&&m.status==='pending').forEach(m=>{m.status='sent';m.sentAt=nowISO();});
  inv.delivery='sent';audit('reminder.sent',inv.number,inv.id);commit();
}

        :emptyState('check','Queue is clear','No receipts or reminders waiting. New payments and due dates will appear here.','')}

        <span>${esc(c?c.name:'')} · ${esc(m.label||'')}</span></div>`;}).join('')}</div>`:''}`;
  $('#mRefresh').onclick=()=>{renderView();toast('Queue refreshed');};
  $$('[data-remind]').forEach(b=>b.onclick=()=>sendReminderNow(b.dataset.remind));
  $$('[data-openrcpt]').forEach(b=>b.onclick=()=>{const r=byId(DB.receipts,b.dataset.openrcpt);if(r){DB.messages.filter(m=>m.receiptId===r.id&&m.status==='pending').forEach(m=>{m.status='sent';m.sentAt=nowISO();});commit();openReceiptViewer(r.id);}});
  $$('[data-dismiss]').forEach(b=>b.onclick=()=>{const m=byId(DB.messages,b.dataset.dismiss);if(m){m.status='dismissed';commit();renderView();}});
}

function reportAging(host){
  const p=P();const cur=p.currency;
  const invs=scoped(DB.invoices).filter(i=>i.lifecycle==='issued'&&invoicePosition(i).balanceMinor>0);
  const rows={};
  invs.forEach(i=>{const c=customer(i.customerId);const key=i.customerId;rows[key]=rows[key]||{name:c?c.name:'—',current:0,'1-30':0,'31-60':0,'61-90':0,'90+':0,total:0};
    const pos=invoicePosition(i);const bk=agingBucket(i);rows[key][bk]+=pos.balanceMinor;rows[key].total+=pos.balanceMinor;});
  const list=Object.values(rows).sort((a,b)=>b.total-a.total);
  const tot={current:0,'1-30':0,'31-60':0,'61-90':0,'90+':0,total:0};
  list.forEach(r=>Object.keys(tot).forEach(k=>tot[k]+=r[k]));

    </tbody>${list.length?`<tfoot><tr style="font-weight:700;background:var(--wash)"><td>Total</td><td class="r money">${money(tot.current,cur)}</td><td class="r money">${money(tot['1-30'],cur)}</td><td class="r money">${money(tot['31-60'],cur)}</td><td class="r money">${money(tot['61-90'],cur)}</td><td class="r money">${money(tot['90+'],cur)}</td><td class="r money">${money(tot.total,cur)}</td></tr></tfoot>`:''}</table></div></div>`;

  const p=P();const cur=p.currency;
  const paid=DB.payments.filter(pm=>pm.profileId===p.id&&(pm.status==='confirmed'||pm.status==='cleared'));
  const byMonth={};let total=0;
  paid.forEach(pm=>{const m=(pm.date||'').slice(0,7);byMonth[m]=(byMonth[m]||0)+pm.amountMinor;total+=pm.amountMinor;});
  const invoiced=scoped(DB.invoices).filter(i=>i.lifecycle==='issued').reduce((s,i)=>s+invoicePosition(i).totalMinor,0);
  const months=Object.entries(byMonth).sort();const maxM=Math.max(1,...Object.values(byMonth));
  host.innerHTML=`<div class="grid g3" style="margin-bottom:16px">
      <div class="stat accent"><div class="lbl">Collected (all time)</div><div class="val money">${money(total,cur)}</div></div>
      <div class="stat"><div class="lbl">Invoiced (issued)</div><div class="val money">${money(invoiced,cur)}</div></div>

function reportEntity(host){
  const cur=P().currency;

  const entities={};
  DB.profiles.forEach(pr=>{
    entities[pr.legalName]=entities[pr.legalName]||{legal:pr.legalName,brands:[],invoiced:0,collected:0,outstanding:0};

    DB.invoices.filter(i=>i.profileId===pr.id&&i.lifecycle==='issued').forEach(i=>{const pos=invoicePosition(i);inv+=pos.totalMinor;col+=pos.netPaidMinor;out+=pos.balanceMinor;});

function csvCell(v){v=String(v==null?'':v);if(/^[=+\-@]/.test(v))v="'"+v;if(/[",\n]/.test(v))v='"'+v.replace(/"/g,'""')+'"';return v;}
function exportCSV(){
  const p=P();const rows=[['Invoice','Date','Due','Customer','Currency','Total','Paid','Balance','Status']];
  scoped(DB.invoices).filter(i=>i.lifecycle==='issued').forEach(i=>{const pos=invoicePosition(i);const c=customer(i.customerId);
    rows.push([i.number,i.issueDate,i.dueDate,c?c.name:'',i.currency,minorToStr(pos.totalMinor,i.currency),minorToStr(pos.netPaidMinor,i.currency),minorToStr(pos.balanceMinor,i.currency),pos.payStatus]);});
  const csv=rows.map(r=>r.map(csvCell).join(',')).join('\n');
  downloadFile(p.brandName.replace(/\W+/g,'_')+'_invoices.csv',csv,'text/csv');

/* ========================= PWA / INSTALL ========================= */
function makeAppIcon(size){
  const cv=document.createElement('canvas');cv.width=cv.height=size;const x=cv.getContext('2d');
  x.fillStyle='#12161f';
  if(x.roundRect){x.beginPath();x.roundRect(0,0,size,size,size*0.22);x.fill();}else{x.fillRect(0,0,size,size);}
  x.fillStyle='#eef2ff';x.font='bold '+Math.round(size*0.58)+'px -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif';
  x.textAlign='center';x.textBaseline='middle';x.fillText('L',size*0.5,size*0.50);
  x.strokeStyle='#3b5bdb';x.lineWidth=Math.max(2,size*0.055);x.lineCap='round';
  x.beginPath();x.moveTo(size*0.35,size*0.72);x.lineTo(size*0.68,size*0.72);x.stroke();
  try{return cv.toDataURL('image/png');}catch(e){return '';}
}
function setupPWA(){
  try{
    // If a real manifest file is already linked (hosted bundle), leave everything to it.
    if(document.querySelector('link[rel="manifest"]'))return;
    const i180=makeAppIcon(180),i192=makeAppIcon(192),i512=makeAppIcon(512);
    let al=document.querySelector('link[rel="apple-touch-icon"]');
    if(!al){al=document.createElement('link');al.rel='apple-touch-icon';document.head.appendChild(al);al.href=i180;}
    let fav=document.querySelector('link[rel="icon"]');
    if(!fav){fav=document.createElement('link');fav.rel='icon';document.head.appendChild(fav);fav.href=i192;}
    const manifest={name:'Ledgerline',short_name:'Ledgerline',description:'Multi-business invoicing & receivables',
      start_url:'./',scope:'./',display:'standalone',background_color:'#0e1117',theme_color:'#12161f',
      icons:[{src:i192,sizes:'192x192',type:'image/png',purpose:'any maskable'},
             {src:i512,sizes:'512x512',type:'image/png',purpose:'any maskable'}]};
    const url=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'}));
    const ml=document.createElement('link');ml.rel='manifest';ml.href=url;document.head.appendChild(ml);
  }catch(e){/* icon/canvas unavailable — app still runs */}
}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();window.__installPrompt=e;
  const b=document.querySelector('#installBtn');if(b){b.style.display='';}});
function isStandalone(){return window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true;}
function isIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent);}

/* ========================= BOOT ========================= */
async function boot(){
  setupPWA();
  if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  }
  DB=await Storage.load();
  if(!DB||!DB.profiles){DB=freshDB(true);await Storage.save(DB);}
  // migrate: ensure arrays exist
  ['customers','catalog','estimates','invoices','payments','receipts','credits','refunds','writeoffs','messages','audit','attachments'].forEach(k=>{if(!DB[k])DB[k]=[];});
  UI.profileId=DB.profiles[0].id;
  renderShell();
  // refresh reminder queue on load
  refreshReminderQueue();commit();
}
window.addEventListener('DOMContentLoaded',boot);
if(document.readyState!=='loading')boot();
</script>
